<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peek Remote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Rubik:wght@500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one living room at night. The TV is the only light source; the remote is the object in your hand. */
:root{
  --room:#151a22; --room-2:#1d2430; --ink:#ece7dc; --muted:#8e97a8; --line:rgba(236,231,220,.14);
  --vfd:#7ef2df; --vfd-dim:rgba(126,242,223,.42); --glass:#071110; --signal:#e2462f;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-key:"Rubik", ui-rounded, system-ui, sans-serif;
  --f-mono:"Share Tech Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
html{box-sizing:border-box; height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{height:100%; margin:0; background:var(--room); color:var(--ink); font-family:var(--f-display); overflow-x:hidden; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--room)}
button{font:inherit; color:inherit}

.glow{position:fixed; left:50%; top:8%; width:80vmax; height:60vmax; transform:translateX(-50%); border-radius:50%;
  background-color:var(--room-2); filter:blur(90px); opacity:.24; z-index:-1; transition:background-color .7s ease; pointer-events:none}

.app{min-height:100%; display:grid; grid-template-rows:auto auto auto; gap:10px;
  padding-block:10px 18px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  position:relative; isolation:isolate}

/* ---------- header ---------- */
.bar{display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap}
.mark{display:flex; align-items:baseline; gap:8px; font-weight:800; font-size:19px; letter-spacing:-.02em; margin:0}
.mark small{font:11px var(--f-mono); color:var(--muted); letter-spacing:.12em; text-transform:uppercase}
.tools{display:flex; align-items:center; gap:8px}
.sw{width:22px; height:22px; border-radius:50%; padding:0; cursor:pointer; background:var(--c);
  border:2px solid var(--room); box-shadow:0 0 0 1px var(--line), inset 0 -4px 0 rgba(0,0,0,.22)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink), inset 0 -4px 0 rgba(0,0,0,.22)}
.tog{font:11px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); background:transparent;
  border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:pointer}
.tog[aria-pressed="true"]{color:var(--ink); border-color:rgba(236,231,220,.4)}
.sep{width:1px; height:18px; background:var(--line)}
:is(.sw,.tog):focus-visible{outline:2px solid var(--vfd); outline-offset:3px}

/* ---------- TV ---------- */
.tvwrap{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:grid; justify-items:center; gap:8px;
  padding-block:4px 10px; background:linear-gradient(var(--room) 82%, rgba(21,26,34,0))}
.tv{position:relative; width:min(100%, calc(25dvh * 16 / 9)); max-width:100%; aspect-ratio:16/9; padding:5px 5px 9px;
  border-radius:10px; background:linear-gradient(#17191d,#0c0d0f); box-shadow:0 0 0 1px #2b313b, 0 24px 50px rgba(0,0,0,.55)}
.screen{position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#020303; container-type:inline-size}
.screen::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.07), transparent 35%), repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px)}
.crt{position:absolute; inset:0; transform-origin:center}
.crt canvas{display:block; width:100%; height:100%}
.crt.off{animation:crtOff .42s forwards}
.crt.on{animation:crtOn .5s}
@keyframes crtOff{0%{transform:scale(1,1); filter:brightness(1)} 55%{transform:scale(1,.006); filter:brightness(4)} 100%{transform:scale(0,0); filter:brightness(4)}}
@keyframes crtOn{0%{transform:scale(0,.006); filter:brightness(4)} 45%{transform:scale(1,.006); filter:brightness(4)} 100%{transform:scale(1,1); filter:brightness(1)}}
.tvled{position:absolute; right:14px; bottom:3px; width:4px; height:4px; border-radius:50%; background:#d33; box-shadow:0 0 6px #f44; opacity:0; transition:opacity .3s}
.tv.is-off .tvled{opacity:1}

.banner{position:absolute; left:3.5%; right:3.5%; bottom:5%; display:flex; gap:3cqw; align-items:center;
  padding:2cqw 3cqw; border-radius:1.6cqw; background:rgba(8,10,14,.8); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s; pointer-events:none}
.banner.show{opacity:1; transform:none}
.bnum{font:800 clamp(18px, 8cqw, 64px)/1 var(--f-display); letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.bmain{flex:1; min-width:0; display:grid; gap:.6cqw}
.bname{font:700 clamp(10px, 2.6cqw, 20px)/1.1 var(--f-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bname span{font-family:var(--f-mono); font-weight:400; color:var(--muted); margin-left:.6em}
.bprog{font:500 clamp(10px, 2.3cqw, 17px)/1.15 var(--f-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bbar{height:max(2px,.6cqw); border-radius:2px; background:rgba(255,255,255,.18); overflow:hidden}
.bbar i{display:block; height:100%; background:var(--ink); width:0}
.bnext{font:clamp(9px, 1.9cqw, 14px)/1.1 var(--f-mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.osd-vol{position:absolute; right:4%; top:12%; bottom:30%; width:clamp(26px, 6cqw, 48px); display:grid; grid-template-rows:auto 1fr; gap:1cqw;
  justify-items:center; padding:1.4cqw 0; border-radius:1.4cqw; background:rgba(8,10,14,.75); font:clamp(10px,2.2cqw,16px) var(--f-mono);
  opacity:0; transition:opacity .2s; pointer-events:none; font-variant-numeric:tabular-nums}
.osd-vol.show{opacity:1}
.vtrack{position:relative; width:30%; border-radius:4px; background:rgba(255,255,255,.18); overflow:hidden}
.vtrack i{position:absolute; left:0; right:0; bottom:0; background:var(--ink)}
.osd-vol.muted .vtrack i{background:var(--signal)}
.kbd{display:none; margin:0; font:11px var(--f-mono); letter-spacing:.08em; color:var(--muted); text-align:center; text-wrap:balance}
.kbd b{color:var(--ink); font-weight:400}

/* ---------- stage + remote ---------- */
.stage{position:relative; display:grid; justify-items:center; align-content:start; min-height:0; min-width:0}
.fit{position:relative}
.scaler{position:absolute; left:0; top:0; width:300px; transform-origin:0 0; perspective:1500px; padding-bottom:30px}

.remote{
  --body:#d9d3c5; --body-hi:#ece7db; --side:#a59d8c; --well:#bbb4a3;
  --key:#3a3e44; --key-skirt:#212428; --key-ink:#eeeae1;
  --fkey:#f2ede2; --fkey-skirt:#bdb5a3; --fkey-ink:#3a3e44;
  --ok:#1d6b66; --ok-skirt:#0e403c; --ok-ink:#dcfff8;
  --pwr:#d9442f; --pwr-skirt:#91281a; --pwr-ink:#fff4ee;
  --etch:rgba(46,40,32,.5);
  --rx:6deg; --ry:0deg;
  position:relative; width:300px; padding:16px 22px 26px; border-radius:50px;
  display:flex; flex-direction:column; gap:14px;
  background:
    radial-gradient(rgba(0,0,0,.07) .7px, transparent 1px) 0 0/6px 7px,
    radial-gradient(rgba(255,255,255,.16) .7px, transparent 1px) 3px 3px/9px 8px,
    linear-gradient(172deg, var(--body-hi), var(--body) 55%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 10px rgba(0,0,0,.12),
    0 14px 0 var(--side), 0 16px 2px rgba(0,0,0,.3), 0 44px 60px rgba(0,0,0,.55);
  transform:rotateX(var(--rx)) rotateY(var(--ry)); transform-origin:50% 40%;
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation}
.remote[data-finish="graphite"]{--body:#34383e; --body-hi:#424750; --side:#1b1e22; --well:#24272c;
  --key:#4d525a; --key-skirt:#2b2f34; --key-ink:#efebe3; --fkey:#6b7179; --fkey-skirt:#42474e; --fkey-ink:#f6f3ec; --etch:rgba(236,232,224,.42)}
.remote[data-finish="sage"]{--body:#b6c1ab; --body-hi:#ccd6c2; --side:#84907b; --well:#a0ab95;
  --key:#2d3833; --key-skirt:#171f1b; --key-ink:#e8eee4; --fkey:#e9eee0; --fkey-skirt:#adb8a1; --fkey-ink:#2d3833; --etch:rgba(30,40,34,.5)}

.ir{align-self:center; width:74px; height:9px; border-radius:6px; margin-top:-4px; background:#111316;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.3); transition:background .2s, box-shadow .2s}
.ir.fire{background:#3b0f25; box-shadow:inset 0 1px 2px rgba(0,0,0,.7), 0 0 12px 2px rgba(255,70,140,.55); transition:none}

.toprow{display:grid; grid-template-columns:46px 1fr 46px; align-items:center}
.logo{text-align:center; font:800 15px/1 var(--f-display); letter-spacing:.24em; color:var(--etch); padding-left:.24em}
.logo small{display:block; margin-top:4px; font:9px/1 var(--f-mono); letter-spacing:.18em}

/* key: a well cut into the body, a cap sitting on a spring above it */
.key{--d:5px; --cap:var(--key); --skirt:var(--key-skirt); --kink:var(--key-ink);
  position:relative; display:block; border:0; padding:0; background:transparent; color:var(--kink);
  height:40px; border-radius:12px; cursor:pointer; touch-action:none; font:600 18px/1 var(--f-key)}
.key::before{content:""; position:absolute; inset:-3px -3px -2px; border-radius:inherit; background:var(--well);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.38), 0 1px 0 rgba(255,255,255,.35)}
.cap{position:absolute; inset:0; display:grid; place-items:center; border-radius:inherit;
  background:linear-gradient(180deg, color-mix(in oklab, var(--cap) 78%, white) 0%, var(--cap) 42%, color-mix(in oklab, var(--cap) 92%, black) 100%);
  box-shadow:0 var(--d) 0 var(--skirt), 0 calc(var(--d) + 3px) 7px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(calc(-1 * var(--d)));
  transition:transform .34s cubic-bezier(.3,1.9,.45,1), box-shadow .34s cubic-bezier(.3,1.9,.45,1)}
.key.down .cap{transform:translateY(-1px); box-shadow:0 1px 0 var(--skirt), 0 2px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2); transition-duration:.035s}
.key:focus-visible{outline:none}
.key:focus-visible .cap{outline:2px solid var(--vfd); outline-offset:3px}
.key.fn{--cap:var(--fkey); --skirt:var(--fkey-skirt); --kink:var(--fkey-ink)}
.key.pwr{--cap:var(--pwr); --skirt:var(--pwr-skirt); --kink:var(--pwr-ink)}
.key.ok{--cap:var(--ok); --skirt:var(--ok-skirt); --kink:var(--ok-ink)}
.key.round{width:46px; height:46px; border-radius:50%}
.key.pill{height:30px; border-radius:15px; --d:4px; font:11px/1 var(--f-mono); letter-spacing:.16em; text-transform:uppercase}
.key.word{font:11px/1 var(--f-mono); letter-spacing:.14em; text-transform:uppercase}

/* display: a dark glass window with a phosphor readout */
.vfd{position:relative; height:144px; border-radius:16px; background:var(--glass); overflow:hidden; color:var(--vfd);
  font-family:var(--f-mono); touch-action:none; cursor:grab;
  box-shadow:0 0 0 3px rgba(0,0,0,.3), 0 2px 0 3px rgba(255,255,255,.28), inset 0 8px 22px rgba(0,0,0,.7)}
.vfd::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit; z-index:4;
  background:linear-gradient(150deg, rgba(255,255,255,.12), transparent 38%), repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px)}
.view{position:absolute; inset:0; padding:10px 13px; display:flex; flex-direction:column; text-shadow:0 0 6px rgba(126,242,223,.45)}
.row{display:flex; justify-content:space-between; align-items:center; gap:8px}
.lbl{font-size:10px; letter-spacing:.16em; color:var(--vfd-dim)}
.big{display:flex; align-items:baseline; gap:9px; margin-top:6px; min-width:0}
.big .n{font-size:40px; line-height:1; font-variant-numeric:tabular-nums}
.big .nm{font-size:12px; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pt{font-size:13px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.meter{height:3px; margin-top:7px; background:rgba(126,242,223,.16); border-radius:2px; overflow:hidden}
.meter i{display:block; height:100%; width:0; background:var(--vfd); box-shadow:0 0 6px var(--vfd)}
.hint{margin-top:auto; font-size:9.5px; letter-spacing:.16em; color:var(--vfd-dim)}

.peek{padding:0; text-shadow:none}
.peek canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.ptop,.pbot{position:relative; z-index:2; padding:8px 11px}
.ptop{display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#f3fffc;
  background:linear-gradient(rgba(4,10,10,.85), rgba(4,10,10,0))}
.ptop .tag{padding:2px 5px 1px; border-radius:3px; background:var(--vfd); color:#052520; font-size:9.5px; letter-spacing:.16em}
.ptop .pn{font-size:13px}
.ptop .pname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pbot{margin-top:auto; color:#f3fffc; background:linear-gradient(rgba(4,10,10,0), rgba(4,10,10,.92) 40%); padding-top:18px}
.pbot .pt{margin:0; font-family:var(--f-display); font-weight:700; font-size:13px}
.pbot .row{font-size:10px; letter-spacing:.08em; margin-top:3px; color:rgba(243,255,252,.75)}
.go{color:var(--vfd); letter-spacing:.14em; text-shadow:0 0 6px rgba(126,242,223,.6)}
.pbot .meter{margin-top:5px; background:rgba(255,255,255,.2)}
.pbot .meter i{background:#f3fffc; box-shadow:none}
.ptimer{position:absolute; left:0; top:0; height:2px; background:var(--vfd); z-index:3; width:100%; transform-origin:left; box-shadow:0 0 6px var(--vfd)}

.entry{align-items:center; justify-content:center; gap:4px}
.entry .n{font-size:56px; line-height:1; letter-spacing:.08em}

.guide{padding:0}
.glist{position:relative; list-style:none; margin:0; padding:6px; height:100%; overflow-y:auto; touch-action:pan-y; scrollbar-width:none}
.glist::-webkit-scrollbar{display:none}
.glist li{display:grid; grid-template-columns:62px 1fr; gap:9px; align-items:center; padding:5px 6px; border-radius:8px; cursor:pointer; text-shadow:none}
.glist li.sel{background:rgba(126,242,223,.14); box-shadow:inset 0 0 0 1px rgba(126,242,223,.45)}
.glist canvas{width:62px; height:35px; border-radius:3px; display:block; background:#000}
.glist .gt{min-width:0; display:grid; gap:2px}
.glist b{font-weight:400; font-size:11px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.glist b em{font-style:normal; color:#052520; background:var(--vfd); border-radius:2px; padding:0 3px; margin-left:4px; font-size:8.5px; vertical-align:1px}
.glist span{font-size:11px; color:rgba(243,255,252,.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.glist .meter{margin-top:2px; height:2px}

.offv{align-items:center; justify-content:center; gap:6px; text-align:center}
.offv .lbl{font-size:10px}

.pills{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding-inline:4px}

.mid{display:flex; justify-content:space-between; align-items:center; padding-inline:2px; margin-top:4px}
.rocker{position:relative; width:50px; height:134px; border-radius:25px}
.rocker::before{content:""; position:absolute; inset:-3px -3px -2px; border-radius:inherit; background:var(--well); box-shadow:inset 0 2px 4px rgba(0,0,0,.38), 0 1px 0 rgba(255,255,255,.35)}
.rcap,.ring{position:absolute; inset:0; border-radius:inherit; color:var(--key-ink);
  background:linear-gradient(180deg, color-mix(in oklab, var(--key) 78%, white) 0%, var(--key) 30%, color-mix(in oklab, var(--key) 90%, black) 100%);
  box-shadow:0 5px 0 var(--key-skirt), 0 8px 7px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(-5px);
  transition:transform .34s cubic-bezier(.3,1.9,.45,1), box-shadow .34s cubic-bezier(.3,1.9,.45,1)}
.rcap{display:grid; grid-template-rows:1fr auto 1fr; justify-items:center; align-items:center; font:500 22px/1 var(--f-key)}
.rcap small{font:9px/1 var(--f-mono); letter-spacing:.16em; opacity:.6; padding-left:.16em}
.rocker.p-up .rcap{transform:translateY(-3px) perspective(260px) rotateX(16deg); box-shadow:0 3px 0 var(--key-skirt), 0 4px 4px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2); transition-duration:.04s}
.rocker.p-dn .rcap{transform:translateY(-3px) perspective(260px) rotateX(-16deg); box-shadow:0 3px 0 var(--key-skirt), 0 4px 4px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2); transition-duration:.04s}
.hit{position:absolute; border:0; padding:0; margin:0; background:transparent; cursor:pointer; touch-action:none; z-index:1}
.rocker .hit{left:0; right:0; height:50%}
.rocker .hit.t{top:-5px; border-radius:25px 25px 0 0}
.rocker .hit.b{bottom:5px; border-radius:0 0 25px 25px}
.hit:focus-visible{outline:2px solid var(--vfd); outline-offset:2px}

.dpad{position:relative; width:138px; height:138px; border-radius:50%}
.dpad::before{content:""; position:absolute; inset:-3px -3px -2px; border-radius:50%; background:var(--well); box-shadow:inset 0 2px 4px rgba(0,0,0,.38), 0 1px 0 rgba(255,255,255,.35)}
.ring .ar{position:absolute; display:grid; place-items:center; width:24px; height:24px; opacity:.85}
.ar.u{left:50%; top:6px; margin-left:-12px} .ar.d{left:50%; bottom:6px; margin-left:-12px}
.ar.l{top:50%; left:6px; margin-top:-12px} .ar.r{top:50%; right:6px; margin-top:-12px}
.dpad.p-up .ring{transform:translateY(-3px) perspective(320px) rotateX(11deg)}
.dpad.p-down .ring{transform:translateY(-3px) perspective(320px) rotateX(-11deg)}
.dpad.p-left .ring{transform:translateY(-3px) perspective(320px) rotateY(-11deg)}
.dpad.p-right .ring{transform:translateY(-3px) perspective(320px) rotateY(11deg)}
.dpad:is(.p-up,.p-down,.p-left,.p-right) .ring{box-shadow:0 3px 0 var(--key-skirt), 0 4px 4px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2); transition-duration:.04s}
.dpad .hit{inset:-5px 0 5px; border-radius:50%}
.dpad .hit.u{clip-path:polygon(0 0,100% 0,50% 50%)} .dpad .hit.d{clip-path:polygon(0 100%,100% 100%,50% 50%)}
.dpad .hit.l{clip-path:polygon(0 0,0 100%,50% 50%)} .dpad .hit.r{clip-path:polygon(100% 0,100% 100%,50% 50%)}
.dpad .key.ok{position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-34px 0 0 -29px; z-index:2; border-radius:50%; font:600 14px/1 var(--f-key); letter-spacing:.06em}
.dpad .key.ok::before{background:var(--key-skirt)}

.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:13px 14px; padding-inline:6px; margin-top:6px}

.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.haptic{position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; left:-9999px}

/* wide screens: TV left, remote right, everything on one screen */
@media (min-aspect-ratio: 5/4) and (min-width: 720px){
  .app{height:100%; min-height:0; grid-template-columns:minmax(0,1.65fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:28px}
  .bar{grid-column:1/-1}
  .tvwrap{position:static; align-content:center; background:none; gap:16px}
  .tv{width:min(100%, calc((100dvh - 150px) * 16 / 9)); padding:7px 7px 12px}
  .stage{align-content:center}
}
@media (hover:hover) and (pointer:fine) and (min-width:720px){ .kbd{display:block} }
@media (prefers-reduced-motion: reduce){
  .cap,.rcap,.ring{transition-timing-function:ease-out !important; transition-duration:.12s !important}
  .remote{transition:none}
  .crt.off,.crt.on{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>
<main class="app">
  <header class="bar">
    <h1 class="mark">Peek <small>remote prototype</small></h1>
    <div class="tools" role="group" aria-label="Remote settings">

if (finePtr.matches && !reduced) addEventListener('pointermove', e => {
  const r = remote.getBoundingClientRect(), dx = (e.clientX - (r.left + r.width / 2)) / innerWidth, dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
  remote.style.setProperty('--ry', (dx * 10).toFixed(2) + 'deg'); remote.style.setProperty('--rx', (14 - dy * 8).toFixed(2) + 'deg');
});

/* ================= render loop ================= */
function sizeCv(cv, scale, maxDpr) {
  const d = Math.min(devicePixelRatio || 1, maxDpr);
  const w = Math.max(2, Math.round(cv.offsetWidth * scale * d)), h = Math.max(2, Math.round(cv.offsetHeight * scale * d));

}
const tvCv = $('tvCv'), tvC = tvCv.getContext('2d'), pCv = $('pCv'), pC = pCv.getContext('2d');
const gCvs = [...$('glist').querySelectorAll('canvas')].map(cv => cv.getContext('2d'));
let lastThumb = 0, lastSec = 0;
function frame(now) {
  const t = now / 1000;
  if (S.on) {
    const [w, h] = sizeCv(tvCv, 1, 1.5);
    if (now < S.staticUntil) staticNoise(tvC, w, h);
    else { const ch = CH[S.cur]; ch.draw(tvC, w, h, chT(ch, t)); bug(tvC, w, h, ch); }
  }
  if (S.mode === 'peek') {
    const [w, h] = sizeCv(pCv, S.scale, 2);
    if (S.peek >= 0) { const ch = CH[S.peek]; ch.draw(pC, w, h, chT(ch, t)); } else noSignal(pC, w, h);
    const left = (S.peekUntil - now) / S.peekLen;
    $('pTimer').style.transform = `scaleX(${Math.max(0, left)})`;
    if (left <= 0) setMode('idle');
  }
  if (S.mode === 'guide' && now - lastThumb > 66) {
    lastThumb = now; gCvs.forEach((c, i) => CH[i].draw(c, 124, 70, chT(CH[i], t)));
  }
  if (now - lastSec > 1000) {
    lastSec = now;
    if (S.mode === 'idle') renderIdle();
    if (S.mode === 'guide') [...$('glist').children].forEach((li, i) => { const p = prog(CH[i]); li.querySelector('span').textContent = p.title; li.querySelector('.meter i').style.width = (p.p * 100).toFixed(1) + '%'; });
    if ($('banner').classList.contains('show')) $('bBar').style.width = (prog(CH[S.cur]).p * 100).toFixed(1) + '%';
  }
  requestAnimationFrame(frame);
}
setMode('idle'); glow(); requestAnimationFrame(frame);
setTimeout(() => showBanner(), 400);
})();
